name: Tests and security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.15
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: uv run python -m consumidor.evaluate --output evals/ci-result.json
        env:
          PYTHONPATH: src
      - run: uv run bandit -r src -q
      - run: uv run pip-audit
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: evals/ci-result.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t consumidor-rag .
