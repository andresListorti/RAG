[project]
name = "rag"
version = "0.1.0"
description = "Auditable agentic RAG over Argentina's Consumer Protection Act"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=6.3.0,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
